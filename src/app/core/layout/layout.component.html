<mat-sidenav-container class="layout-container">
  <mat-sidenav mode="side" opened class="sidebar">
    <div class="sidebar-header">
      <mat-icon class="brand-icon" color="primary">directions_car</mat-icon>
      <span class="brand-title">FleetRisk</span>
    </div>

    <mat-nav-list class="sidebar-nav">
      <a
        mat-list-item
        routerLink="/quotes"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon matListItemIcon color="primary">dashboard</mat-icon>
        <div matListItemTitle>Dashboard</div>
      </a>

      <a mat-list-item routerLink="/quotes/new" routerLinkActive="active-link">
        <mat-icon matListItemIcon color="primary">add_circle</mat-icon>
        <div matListItemTitle>Nova Cotação</div>
      </a>
    </mat-nav-list>

    <div class="sidebar-footer">
      <button mat-button color="warn" (click)="logout()" class="logout-button">
        <mat-icon>logout</mat-icon>
        Sair
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-wrapper">
    <mat-toolbar class="topbar">
      <span class="topbar-title">Portal do Corretor</span>
      <span class="spacer"></span>
      <button mat-icon-button color="primary">
        <mat-icon>person</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
