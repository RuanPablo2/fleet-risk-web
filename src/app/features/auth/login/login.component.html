<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="brand-title">FleetRisk</h1>
      <p class="brand-subtitle">Portal do Corretor</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input
          type="email"
          formControlName="email"
          class="form-input"
          placeholder="corretor@seguros.com"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input
          type="password"
          formControlName="password"
          class="form-input"
          placeholder="••••••••"
        />
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="auth-button">
        Entrar
      </button>
    </form>

    <div class="auth-footer">
      Nova corretora?
      <a routerLink="/register" class="auth-link">Registre-se aqui</a>
    </div>
  </div>
</div>
