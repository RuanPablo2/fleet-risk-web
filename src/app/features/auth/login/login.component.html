<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">FleetRisk</h1>
      <p class="text-sm text-gray-500">Portal do Corretor</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700">E-mail</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500"
          placeholder="corretor@seguros.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Senha</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full px-4 py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
      >
        Entrar
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
      Nova corretora?
      <a routerLink="/auth/register" class="text-blue-600 hover:underline"
        >Registre-se aqui</a
      >
    </div>
  </div>
</div>
