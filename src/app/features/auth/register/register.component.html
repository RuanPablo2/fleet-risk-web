<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2 class="brand-title">Nova Conta</h2>
      <p class="brand-subtitle">Cadastre sua corretora no FleetRisk</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label">Nome da Corretora</label>
        <input type="text" formControlName="name" class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label">CNPJ</label>
        <input
          type="text"
          formControlName="cnpj"
          class="form-input"
          maxlength="18"
          (input)="onCnpjInput($event)"
          placeholder="00.000.000/0000-00"
        />
      </div>

      <div class="form-group">
        <label class="form-label">E-mail Comercial</label>
        <input type="email" formControlName="email" class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" formControlName="password" class="form-input" />
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="auth-button auth-button--success"
      >
        Cadastrar
      </button>
    </form>

    <div class="auth-footer">
      Já possui conta?
      <a routerLink="/login" class="auth-link">Voltar para o Login</a>
    </div>
  </div>
</div>
