<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-md">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-gray-800">Nova Conta</h2>
      <p class="text-sm text-gray-500">Cadastre sua corretora no FleetRisk</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700"
          >Nome da Corretora</label
        >
        <input
          type="text"
          formControlName="name"
          class="w-full px-4 py-2 mt-1 border rounded-md"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700"
          >CNPJ (Somente números)</label
        >
        <input
          type="text"
          formControlName="cnpj"
          class="w-full px-4 py-2 mt-1 border rounded-md"
          maxlength="14"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700"
          >E-mail Comercial</label
        >
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 mt-1 border rounded-md"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Senha</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 mt-1 border rounded-md"
        />
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full px-4 py-2 mt-4 text-white bg-green-600 rounded-md hover:bg-green-700 disabled:bg-gray-400"
      >
        Cadastrar
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
      Já possui conta?
      <a routerLink="/auth/login" class="text-blue-600 hover:underline"
        >Voltar para o Login</a
      >
    </div>
  </div>
</div>
